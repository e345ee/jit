schemaVersion: "1.0"

solution:
  name: "Навигатор для пациента"
  teamId: "JIT"

api:
  baseUrl: "https://kronva-stat.ru/api"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "API health"
    description: "Проверяет, что публичный API отвечает."
    method: "GET"
    path: "/health"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status", "service"]
    timeoutMs: 5000
    repeatable: true

  - id: "ready"
    name: "Content readiness"
    description: "Проверяет загрузку каталога ситуаций и справочных материалов."
    method: "GET"
    path: "/ready"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status", "service", "content"]
    timeoutMs: 5000
    repeatable: true

  - id: "content-version"
    name: "Content version"
    description: "Возвращает версию контента и счетчики карточек."
    method: "GET"
    path: "/content/version"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["version", "situations", "knowledge", "dataStatus"]
    timeoutMs: 5000
    repeatable: true

  - id: "mri-search"
    name: "Search MRI route"
    description: "Проверяет поиск основного демо-сценария МРТ с контрастом."
    method: "GET"
    path: "/situations"
    role: "public"
    request:
      query:
        q: "МРТ"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "knowledge-snils-search"
    name: "Search SNILS knowledge card"
    description: "Проверяет поиск справочной карточки по СНИЛС."
    method: "GET"
    path: "/knowledge"
    role: "public"
    request:
      query:
        q: "СНИЛС"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
    timeoutMs: 5000
    repeatable: true

  - id: "create-neutral-reminder"
    name: "Create neutral reminder"
    description: "Создает нейтральное напоминание без диагноза и медицинских подробностей."
    method: "POST"
    path: "/reminders"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        situationId: "mri-contrast"
        stepId: "creatinine"
        remindAt: "2030-09-26T09:00:00.000Z"
        text: "Напоминание: проверьте срок документа."
    expected:
      statusCodes: [200, 201]
      contentType: "application/json"
      requiredFields: ["id", "status"]
    timeoutMs: 5000
    repeatable: false
    extract:
      reminderId: "$.id"

  - id: "reject-medical-reminder"
    name: "Reject reminder with medical details"
    description: "Проверяет, что API отклоняет текст напоминания с медицинскими подробностями."
    method: "POST"
    path: "/reminders"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        situationId: "mri-contrast"
        stepId: "creatinine"
        remindAt: "2030-09-26T09:00:00.000Z"
        text: "Напоминание: проверьте диагноз."
    expected:
      statusCodes: [400]
      contentType: "application/json"
      requiredFields: ["error"]
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "delete-neutral-reminder"
    method: "DELETE"
    path: "/reminders/{id}"
    role: "public"
    request:
      path:
        id: "${reminderId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000
